[package]
name = "rust_game_engine"
version = "0.1.0"
authors = ["Sascha Brunner <sascha.brunner@outlook.com>"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
shaderc = "0.7.2"

[dependencies]
gfx-hal = "0.8.0"
gfx-auxil = "0.9.0"
nalgebra = "0.27.1"
winit = "0.25.0"

[target.'cfg(target_os = "macos")'.dependencies.backend]
package = "gfx-backend-metal"
version = "=0.8.2"

[target.'cfg(windows)'.dependencies.backend]
package = "gfx-backend-dx12"
version = "=0.8.0"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies.backend]
package = "gfx-backend-vulkan"
version = "=0.8.0"